      title: HelpCenterLink
      type: object
      required:
      - id
      - name
      - url
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
    GetKnowledgeArticleTranslationsOutput:
      title: GetKnowledgeArticleTranslationsOutput
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/ArticleTranslations'
    Collection:
      title: Collection
      type: object
      required:
      - id
      - title
      - internalKbEnabled
      - restrictions
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        internalKbEnabled:
          type: boolean
        restrictions:
          $ref: '#/components/schemas/Restrictions'
    ArticleTranslations:
      title: ArticleTranslations
      type: object
      required:
      - translations
      properties:
        translations:
          $ref: '#/components/schemas/TranslationList'
    AttachmentResult:
      title: AttachmentResult
      type: object
      required:
      - originalFilename
      - url
      properties:
        originalFilename:
          description: Original filename of the uploaded file
          type: string
        url:
          description: Public URL of the uploaded file
          type: string
    ListKnowledgeCollectionsOutput:
      title: ListKnowledgeCollectionsOutput
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
